services:
  kafka:
    image: apache/kafka:4.0.0
    container_name: kafka
    ports:
      - "9092:9092"   # host access (Python producers/consumers)
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # Two listeners: PLAINTEXT_HOST for the host machine, PLAINTEXT for inter-container
      KAFKA_LISTENERS: PLAINTEXT_HOST://0.0.0.0:9092,PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_HOST://localhost:9092,PLAINTEXT://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT_HOST:PLAINTEXT,PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8080:8080"   # open http://localhost:8080
    environment:
      DYNAMIC_CONFIG_ENABLED: "true"
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092   # internal listener
    depends_on:
      kafka:
        condition: service_healthy

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: minio
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console → http://localhost:9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 10s

  flink-jobmanager:
    build:
      context: ..
      dockerfile: docker/flink.Dockerfile
    container_name: flink-jobmanager
    command: jobmanager
    ports:
      - "8081:8081"   # Flink Web UI
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092   # internal listener for jobs running in-container
    volumes:
      - ..:/opt/project                       # project files available to flink run-python
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/overview"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  flink-taskmanager:
    build:
      context: ..
      dockerfile: docker/flink.Dockerfile
    container_name: flink-taskmanager
    command: taskmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 4
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    volumes:
      - ..:/opt/project
    depends_on:
      flink-jobmanager:
        condition: service_healthy

  spark-master:
    build:
      context: ..
      dockerfile: docker/spark.Dockerfile
    container_name: spark-master
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master"]
    environment:
      SPARK_MASTER_HOST: spark-master
      PYTHONPATH: /opt/project
      # Override .env so jobs reach MinIO via the Docker network
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-market-data}
      MINIO_ANALYSIS_BUCKET: ${MINIO_ANALYSIS_BUCKET:-market-analysis}
      SPARK_MASTER_URL: spark://spark-master:7077
    ports:
      - "7077:7077"   # Spark submit port
      - "8082:8080"   # Spark Master Web UI → http://localhost:8082
    volumes:
      - ..:/opt/project
      - spark_logs:/tmp/spark-events   # event logs read by history server
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  spark-worker:
    build:
      context: ..
      dockerfile: docker/spark.Dockerfile
    container_name: spark-worker
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    environment:
      SPARK_WORKER_MEMORY: 2g
      SPARK_WORKER_CORES: "2"
      PYTHONPATH: /opt/project
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-market-data}
      MINIO_ANALYSIS_BUCKET: ${MINIO_ANALYSIS_BUCKET:-market-analysis}
    volumes:
      - ..:/opt/project
    depends_on:
      spark-master:
        condition: service_healthy

  jupyter:
    build:
      context: ..
      dockerfile: docker/jupyter.Dockerfile
    container_name: jupyter
    ports:
      - "8888:8888"   # JupyterLab UI → http://localhost:8888 (no token required)
    environment:
      PYTHONPATH: /opt/project
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-market-data}
      MINIO_ANALYSIS_BUCKET: ${MINIO_ANALYSIS_BUCKET:-market-analysis}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    volumes:
      - ..:/opt/project
    depends_on:
      minio:
        condition: service_healthy

  spark-history-server:
    build:
      context: ..
      dockerfile: docker/spark.Dockerfile
    container_name: spark-history-server
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.history.HistoryServer"]
    environment:
      SPARK_HISTORY_OPTS: >-
        -Dspark.history.fs.logDirectory=/tmp/spark-events
        -Dspark.history.ui.port=18080
    ports:
      - "18080:18080"   # Spark History Server UI → http://localhost:18080
    volumes:
      - spark_logs:/tmp/spark-events
    depends_on:
      spark-master:
        condition: service_healthy

  dagster-webserver:
    build:
      context: ..
      dockerfile: docker/dagster.Dockerfile
    container_name: dagster-webserver
    command: dagster-webserver -h 0.0.0.0 -p 3000 -w /opt/dagster/app/workspace.yaml
    ports:
      - "3000:3000"   # Dagster UI → http://localhost:3000
    environment:
      DAGSTER_HOME: /opt/dagster/dagster_home
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-market-data}
      MINIO_ANALYSIS_BUCKET: ${MINIO_ANALYSIS_BUCKET:-market-analysis}
    volumes:
      - ..:/opt/project
      - ../dagster:/opt/dagster/app
      - dagster_storage:/opt/dagster/dagster_home/storage
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      minio:
        condition: service_healthy
      spark-master:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3000/server_info')"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  dagster-daemon:
    build:
      context: ..
      dockerfile: docker/dagster.Dockerfile
    container_name: dagster-daemon
    command: dagster-daemon run
    environment:
      DAGSTER_HOME: /opt/dagster/dagster_home
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-market-data}
      MINIO_ANALYSIS_BUCKET: ${MINIO_ANALYSIS_BUCKET:-market-analysis}
    volumes:
      - ..:/opt/project
      - ../dagster:/opt/dagster/app
      - dagster_storage:/opt/dagster/dagster_home/storage
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      dagster-webserver:
        condition: service_healthy

volumes:
  kafka_data:
  minio_data:
  spark_logs:
  dagster_storage:
